name: Daily Data Update

on:
  schedule:
    # 每天早上 8:00 (Asia/Shanghai = UTC+8 → 00:00 UTC)
    - cron: "0 0 * * *"
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  fetch-and-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch daily data
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_STOCK_TABLE_ID: ${{ secrets.FEISHU_STOCK_TABLE_ID }}
          FEISHU_METRIC_TABLE_ID: ${{ secrets.FEISHU_METRIC_TABLE_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com
          DEEPSEEK_MODEL: deepseek-chat
        run: python scripts/fetch_daily_data.py

      - name: Commit and push cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cache/
          if git diff --staged --quiet; then
            echo "No cache changes to commit"
          else
            git commit -m "chore: daily data update $(date +'%Y-%m-%d %H:%M %Z')"
            git push
          fi
